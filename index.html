<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yuda Grand Prix</title>
    <meta name="description" content="A retro-style car racing game where you dodge traffic to get the highest score. Built with React, TypeScript, and Tailwind CSS." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏎️</text></svg>" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Screen Shake Effect */
      @keyframes shake {
        10%, 90% { transform: translate3d(-1px, 0, 0); }
        20%, 80% { transform: translate3d(2px, 0, 0); }
        30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
        40%, 60% { transform: translate3d(4px, 0, 0); }
      }
      .shake {
        animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
      }
      
      /* CRT Screen Effects */
      .crt-effect > * {
        /* Applies to the canvas and screen components */
        filter: blur(0.4px) brightness(1.1);
        transform: scale(1.02); /* Slight bulge */
      }
      
      .overlay::before {
         /* Scanlines */
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(to bottom, rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
        background-size: 100% 3px;
        z-index: 2;
        pointer-events: none;
      }

      .overlay::after {
        /* Vignette */
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        box-shadow: inset 0 0 80px 20px rgba(0,0,0,0.5);
        border-radius: 0.5rem; /* Match parent's rounded-lg */
        z-index: 3;
        pointer-events: none;
      }
    </style>

    <link rel="stylesheet" crossorigin href="./assets/index-Bok1BIkm.css">
  </head>

  </body>
